name: Verify

# A fresh runner executes the same full verification command the GUIDE requires
# at the end of every Part. This makes the "verified by CI" claims in FINDINGS
# true and prevents generated-artifact, Baseline, docs-link, and test drift.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm (pinned by packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node 26 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full verification command
        run: |
          pnpm sync:artifacts
          pnpm check:artifacts
          pnpm build
          pnpm typecheck
          pnpm typecheck:apps
          pnpm --filter @lsui/docs run build
          pnpm --filter @lsui/docs run lint:docs
          pnpm check:baseline
          pnpm test
          pnpm test:e2e
